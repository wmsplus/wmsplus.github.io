<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Приём товара — WMS+</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Приём товара">
<meta name="theme-color" content="#623CEA">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
    :root {
        --bg: #DED4FF;
        --card: #FFFFFF;
        --muted: #242038;
        --accent: #623CEA;
        --secondary: #10b981;
        --danger: #ef4444;
        --radius-lg: 16px;
        --radius-md: 10px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--muted); overscroll-behavior: none; }
    @media (max-width: 768px) {
        html, body { overflow: hidden; }
    }
    .screen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: safe center;
        height: 100dvh;
        width: 100%;
        padding: 24px 20px;
        position: relative;
        overflow-y: auto;
    }
    .screen.is-active { display: flex; }
    .screen-card {
        background: var(--card);
        border-radius: var(--radius-lg);
        border: 1px solid rgba(36,32,56,.08);
        padding: 28px;
        width: 100%;
        max-width: 420px;
    }
    h1 { font-size: 20px; margin: 0 0 20px; text-align: center; }
    .field {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(36,32,56,.18);
        border-radius: var(--radius-md);
        font-size: 16px;
        font-family: inherit;
        color: var(--muted);
        background: #fff;
    }
    .primary-btn {
        width: 100%;
        margin-top: 16px;
        padding: 13px;
        border: 0;
        border-radius: var(--radius-md);
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }
    .primary-btn:disabled { opacity: .6; cursor: default; }
    .secondary-btn {
        width: 100%;
        margin-top: 10px;
        padding: 11px;
        border: 1px solid rgba(36,32,56,.18);
        border-radius: var(--radius-md);
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .secondary-btn:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 12px; font-size: 13px; font-weight: 600; text-align: center; min-height: 18px; }
    .msg.is-error { color: var(--danger); }

    .area-btn {
        width: 100%;
        max-width: 320px;
        padding: 22px;
        margin-bottom: 14px;
        border: 2px solid var(--accent);
        border-radius: var(--radius-lg);
        background: #fff;
        color: var(--accent);
        font-size: 20px;
        font-weight: 800;
        cursor: pointer;
    }
    .area-btn:active { background: var(--accent); color: #fff; }

    .area-pill {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top));
        left: calc(14px + env(safe-area-inset-left));
        display: flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border: 1px solid rgba(36,32,56,.12);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        z-index: 10;
    }

    .back-btn {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top));
        right: calc(14px + env(safe-area-inset-right));
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid rgba(36,32,56,.12);
        background: #fff;
        color: var(--muted);
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
    }

    .category-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 100%;
        max-width: 420px;
    }
    .category-btn {
        aspect-ratio: 1;
        border: 1px solid rgba(36,32,56,.12);
        border-radius: var(--radius-md);
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        padding: 4px;
    }
    .category-btn:active { background: var(--bg); }
    .category-emoji { font-size: clamp(20px, 5.5vw, 28px); line-height: 1; }
    .category-label { font-size: 10px; font-weight: 600; text-align: center; line-height: 1.15; }

    .selected-category {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        margin-bottom: 16px;
        font-size: 15px;
        font-weight: 700;
    }
    .selected-category .emoji { font-size: 24px; }

    .photo-btn {
        width: 100%;
        padding: 28px;
        border: 2px dashed rgba(36,32,56,.25);
        border-radius: var(--radius-lg);
        background: #fff;
        color: var(--accent);
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
    }
    .photo-btn:disabled { opacity: .6; cursor: default; }

    .success h1 { color: var(--secondary); }
    .success p { text-align: center; margin: 0 0 6px; }

    .honeypot { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; }
</style>
</head>
<body>

<input type="text" name="c_addr_2" id="c_addr_2" class="honeypot" autocomplete="off" tabindex="-1" aria-hidden="true">

<section id="screenId" class="screen">
    <div class="screen-card">
        <h1>Введите ваш ID</h1>
        <input id="idInput" class="field" type="number" inputmode="numeric" min="1" placeholder="Табельный номер" aria-label="Табельный номер">
        <button id="idNextBtn" class="primary-btn" type="button">Далее</button>
        <div id="idMsg" class="msg"></div>
    </div>
</section>

<section id="screenName" class="screen">
    <div class="screen-card">
        <h1>Введите ваше ФИО</h1>
        <input id="nameInput" class="field" type="text" maxlength="200" placeholder="Фамилия Имя Отчество" aria-label="ФИО">
        <button id="nameNextBtn" class="primary-btn" type="button">Далее</button>
        <div id="nameMsg" class="msg"></div>
    </div>
</section>

<section id="screenArea" class="screen">
    <div class="screen-card" style="text-align:center;">
        <h1>Выберите участок</h1>
        <button class="area-btn" data-area="ХАБ" type="button">ХАБ</button>
        <button class="area-btn" data-area="Упаковка" type="button">Упаковка</button>
        <button class="area-btn" data-area="Маркетплейс" type="button">Маркетплейс</button>
        <button id="changeUserBtn" class="secondary-btn" type="button">Сменить пользователя</button>
    </div>
</section>

<section id="screenItemType" class="screen">
    <div id="areaPillType" class="area-pill"><span id="areaPillTypeText"></span> ✎</div>
    <div class="screen-card" style="text-align:center;">
        <h1>Выберите тип товара</h1>
        <button class="area-btn type-btn" data-type="Мелкий товар" type="button">Мелкий товар</button>
        <button class="area-btn type-btn" data-type="КГТ" type="button">КГТ</button>
        <button class="area-btn type-btn" data-type="Шредер" type="button">Шредер</button>
    </div>
</section>

<section id="screenCategory" class="screen">
    <div id="areaPillCategory" class="area-pill"><span id="areaPillCategoryText"></span> ✎</div>
    <button id="backToTypeBtn" class="back-btn" type="button">←</button>
    <div style="width:100%; max-width:420px;">
        <h1>Выберите категорию</h1>
        <div id="categoryGrid" class="category-grid"></div>
    </div>
</section>

<section id="screenItemName" class="screen">
    <div id="areaPillName" class="area-pill"><span id="areaPillNameText"></span> ✎</div>
    <button id="backToCategoryBtn" class="back-btn" type="button">←</button>
    <div class="screen-card">
        <div id="selectedCategoryLine" class="selected-category"></div>
        <h1>Наименование</h1>
        <input id="itemNameInput" class="field" type="text" maxlength="2000" placeholder="Что за товар" aria-label="Наименование товара">
        <button id="itemNameNextBtn" class="primary-btn" type="button">Далее</button>
        <div id="itemNameMsg" class="msg"></div>
    </div>
</section>

<section id="screenPhoto" class="screen">
    <div id="areaPillPhoto" class="area-pill"><span id="areaPillPhotoText"></span> ✎</div>
    <button id="backToNameBtn" class="back-btn" type="button">←</button>
    <div class="screen-card" style="text-align:center;">
        <h1>Фото</h1>
        <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" style="display:none;">
        <button id="photoPickBtn" class="photo-btn" type="button">📷 Выбрать фото</button>
        <div id="photoMsg" class="msg"></div>
    </div>
</section>

<section id="screenStickerScan" class="screen">
    <div id="areaPillSticker" class="area-pill"><span id="areaPillStickerText"></span> ✎</div>
    <button id="backToPhotoFromScanBtn" class="back-btn" type="button">←</button>
    <div class="screen-card" style="text-align:center;">
        <h1>Отсканируйте стикер</h1>
        <p style="margin:0 0 16px;font-size:14px;">Надёжно упакуйте товар, наклейте пустой стикер и наведите камеру на его QR-код.</p>
        <video id="qrVideo" playsinline muted style="width:100%;max-width:320px;border-radius:var(--radius-md);background:#000;"></video>
        <canvas id="qrCanvas" style="display:none;"></canvas>
        <div id="stickerMsg" class="msg"></div>
        <button id="retryQrScanBtn" class="secondary-btn" type="button">Попробовать снова</button>
    </div>
</section>

<section id="screenSuccess" class="screen success">
    <div class="screen-card" style="text-align:center;">
        <h1>Заявка отправлена</h1>
        <p>Спасибо! Данные сохранены.</p>
        <button id="againBtn" class="primary-btn" type="button">Заполнить ещё раз</button>
    </div>
</section>

<script src="intake.js"></script>
</body>
</html>
