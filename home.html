<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#623CEA">
  <title>WMS+ — Главная</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #242038; background: #ded4ff; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(circle at 100% 0%, #f0ebff 0, transparent 38%), #ded4ff; }
    main { width: min(100%, 420px); }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; color: #5a36dd; font-size: 14px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; color: #fff; background: #623cea; box-shadow: 0 8px 20px rgba(98, 60, 234, .24); }
    .card { padding: 26px; border: 1px solid rgba(36, 32, 56, .08); border-radius: 24px; background: rgba(255, 255, 255, .94); box-shadow: 0 18px 42px rgba(76, 48, 143, .16); }
    h1 { margin: 0; font-size: clamp(26px, 7vw, 32px); line-height: 1.08; letter-spacing: -.04em; }
    p { margin: 10px 0 24px; color: #66748d; font-size: 15px; line-height: 1.45; }
    nav { display: grid; gap: 12px; }
    .menu-link { display: flex; align-items: center; gap: 14px; min-height: 70px; padding: 13px 15px; border: 1px solid #e5e0f5; border-radius: 16px; color: inherit; background: #fff; box-shadow: 0 5px 14px rgba(36, 32, 56, .05); text-decoration: none; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
    .menu-link:hover { transform: translateY(-2px); border-color: #b9a7ff; box-shadow: 0 9px 18px rgba(98, 60, 234, .12); }
    .menu-link:active { transform: translateY(0); }
    .icon { display: grid; flex: 0 0 42px; place-items: center; width: 42px; height: 42px; border-radius: 13px; color: #623cea; background: #eee9ff; font-size: 21px; }
    .menu-link:nth-child(2) .icon { color: #c35d17; background: #fff1dd; }
    .menu-link:nth-child(3) .icon { color: #147567; background: #def8f1; }
    .menu-text { display: grid; gap: 3px; }
    .menu-text strong { font-size: 16px; }
    .menu-text span { color: #73809a; font-size: 12px; font-weight: 650; }
    .arrow { margin-left: auto; color: #9aa7bd; font-size: 24px; line-height: 1; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark">W</span> WMS+</div>
    <section class="card" aria-labelledby="home-title">
      <h1 id="home-title">Рабочие инструменты</h1>
      <p>Выберите, с чем хотите работать.</p>
      <nav aria-label="Разделы">
        <a class="menu-link" href="index.html">
          <span class="icon" aria-hidden="true">⌕</span>
          <span class="menu-text"><strong>Проблемный товар</strong><span>Принять и оформить товар без ШК</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="menu-link" href="violations.html">
          <span class="icon" aria-hidden="true">!</span>
          <span class="menu-text"><strong>Нарушения</strong><span>Фиксации и работа с нарушителями</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="menu-link" href="pass-printing.html">
          <span class="icon" aria-hidden="true">▣</span>
          <span class="menu-text"><strong>Печать пропусков</strong><span>Создание и печать пропусков</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
